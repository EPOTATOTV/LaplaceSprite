name: ecosystem-pr-gate

# PR 子集（设计文档 14.9）：最新 1 个 MC LTS × 最新稳定加载器 × 基线四件套。
# 矩阵格由 ci/generate-matrix.py 从离线版本快照生成。

on:
  pull_request:
    paths:
      - "adapters/**"
      - "ci/**"
      - ".github/workflows/ecosystem-*.yml"
  workflow_dispatch:

concurrency:
  group: ecosystem-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: adapters 单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :adapters:test

  generate-matrix:
    name: 生成矩阵
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 生成 PR 子集
        id: matrix
        run: python ci/generate-matrix.py --tier pr --github-output --cell-file build/ci/matrix-cells-pr.json
      - name: 落盘格定义（失败回溯）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-cells-pr
          path: build/ci/matrix-cells-pr.json
          if-no-files-found: warn

  ecosystem-cell:
    name: ${{ matrix.cell }}
    needs: generate-matrix
    if: needs.generate-matrix.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :cli:installDist
      - name: 单格冒烟
        env:
          LAPLACE: ./cli/build/install/laplace/bin/laplace
          PLATFORM: ${{ matrix.platform }}
          MC: ${{ matrix.mc }}
          ADAPTER: ${{ matrix.loader || matrix.adapter }}
          SMOKE_ONLY: "1"
        run: sh ci/gate.sh pr
      - name: 失败证据
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.platform }}-${{ matrix.mc }}
          path: build/laplace
          if-no-files-found: warn

  gate:
    name: 门禁判定
    needs: [unit-tests, generate-matrix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :cli:installDist
      - name: laplace gate + 冒烟
        env:
          LAPLACE: ./cli/build/install/laplace/bin/laplace
        run: sh ci/gate.sh pr
      - name: 归档
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-pr-evidence
          path: build/laplace
          if-no-files-found: warn
