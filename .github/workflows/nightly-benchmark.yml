name: nightly-benchmark

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  nightly:
    name: 夜间基准（真实环境轨）
    runs-on: [self-hosted, laplace-8h8g]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: 构建并安装 CLI
        run: ./gradlew --no-daemon :cli:installDist
      - name: 8h8g 实例编排
        run: docker compose -f docker/docker-compose.testservers.yml up -d
      - name: 全量基准（10000 合法 + 全作弊矩阵）
        run: ./cli/build/install/laplace/bin/laplace run --suite mixed --players 10000 --ticks 1200 --seed 20261013 --workspace build/laplace
      - name: 恢复 PACC 趋势历史
        uses: actions/cache@v4
        with:
          path: build/laplace/pacc/trend-history.json
          key: pacc-trend-${{ github.run_id }}
          restore-keys: pacc-trend-
      - name: 恢复回归库
        uses: actions/cache@v4
        with:
          path: |
            build/laplace/regression
            build/laplace/regression.json
          key: regression-${{ github.run_id }}
          restore-keys: regression-
      - name: PACC 夜间基准（合法基线 + 作弊矩阵）
        run: |
          ./cli/build/install/laplace/bin/laplace run --suite legit --players 10000 --ticks 1200 --seed 20261018 --workspace build/laplace/pacc
          ./cli/build/install/laplace/bin/laplace run --suite cheat --players 10000 --ticks 1200 --seed 20261018 --workspace build/laplace/pacc
          ./cli/build/install/laplace/bin/laplace pacc \
            --report build/laplace/pacc/report/report.json \
            --version "$(git describe --tags --always)" \
            --history build/laplace/pacc/trend-history.json \
            --sync-regression build/laplace \
            --fail-on-regression \
            --out build/laplace/pacc/trend.svg \
            --markdown build/laplace/pacc/trend.md
      - name: 门禁判定
        run: ./cli/build/install/laplace/bin/laplace gate --workspace build/laplace
      - name: 回归库健康度
        run: |
          if [ -f build/laplace/regression/library.json ]; then
            ARGS="--regression build/laplace/regression/library.json"
            if [ -f build/laplace/regression/flags.json ]; then
              ARGS="$ARGS --regression-flags build/laplace/regression/flags.json"
            fi
            if [ -f build/laplace/regression/bypass.json ]; then
              ARGS="$ARGS --bypass-reports build/laplace/regression/bypass.json"
            fi
            ./cli/build/install/laplace/bin/laplace gate --workspace build/laplace $ARGS --require-regression-health
          else
            echo "未提供回归库快照，跳过健康度门禁"
          fi
      - name: 指标入库
        run: ./cli/build/install/laplace/bin/laplace console --workspace build/laplace --out build/laplace/metrics.json
      - name: 归档证据（含失败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-evidence-${{ github.run_id }}
          path: build/laplace
      - name: 收尾
        if: always()
        run: docker compose -f docker/docker-compose.testservers.yml down -v
