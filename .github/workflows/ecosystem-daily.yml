name: ecosystem-daily

# 每日中间集（设计文档 14.9）：近 3 个 MC 大版本 × 全加载器，插件线加四件套。
# 基岩线与代理线各占独立 job，分别用 JDK 21 / 17。

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ecosystem-daily
  cancel-in-progress: false

jobs:
  generate-matrix:
    name: 生成矩阵
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 生成每日中间集
        id: matrix
        run: python ci/generate-matrix.py --tier daily --github-output --cell-file build/ci/matrix-cells-daily.json
      - name: 落盘格定义（失败回溯）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-cells-daily
          path: build/ci/matrix-cells-daily.json
          if-no-files-found: warn

  ecosystem-cell:
    name: ${{ matrix.cell }}
    needs: generate-matrix
    if: needs.generate-matrix.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :cli:installDist
      - name: 单格冒烟
        env:
          LAPLACE: ./cli/build/install/laplace/bin/laplace
          PLATFORM: ${{ matrix.platform }}
          MC: ${{ matrix.mc }}
          ADAPTER: ${{ matrix.loader || matrix.adapter }}
          SMOKE_ONLY: "1"
        run: sh ci/gate.sh daily
      - name: 失败证据
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.platform }}-${{ matrix.mc }}
          path: build/laplace
          if-no-files-found: warn

  gate:
    name: 门禁判定
    needs: generate-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :cli:installDist
      - name: laplace gate + 三版本冒烟
        env:
          LAPLACE: ./cli/build/install/laplace/bin/laplace
        run: sh ci/gate.sh daily
      - name: 归档
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-daily-evidence
          path: build/laplace
          if-no-files-found: warn

  bedrock-line:
    name: 基岩线（JDK 21）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :cli:installDist
      - name: 基岩适配器冒烟
        run: ./cli/build/install/laplace/bin/laplace test --platform nukkit --mc 1.21

  proxy-line:
    name: 代理线（JDK 17）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :cli:installDist
      - name: 代理适配器冒烟
        run: ./cli/build/install/laplace/bin/laplace test --platform velocity --mc 1.21.11
