name: 功能请求
description: 提出新能力或改进建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        平台以「真实环境编排 + 自动化实测 + 证据归集」为核心，新增能力请说明它落在哪一层
        （输入 / 环境 / 执行 / 判定 / 输出 / 集成）。
  - type: dropdown
    id: layer
    attributes:
      label: 涉及层
      options:
        - 输入层（行为模拟 / 异常样本 / 场景剧本）
        - 环境层（网络模型 / TestServer / 探针）
        - 执行层（适配器 / Runner / Orchestrator）
        - 判定层（断言 / 指标 / 门禁）
        - 输出层（报告 / 证据链 / 回归库）
        - 集成层（CLI / CI / 看板）
        - 文档与开发者体验
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前的手工流程是怎样的，卡在哪一步
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案与取舍
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 issue
          required: true
