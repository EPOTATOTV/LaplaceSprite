      params: {windowTicks: 40}
      expected: {expectedDetected: false, minConfidence: 0.0, boundary: false}
    - tier: MAX
      params: {windowTicks: 40, repeat: 2}
      expected: {expectedDetected: false, minConfidence: 0.0, boundary: false}
    - tier: HIDDEN
      params: {windowTicks: 30}
      expected: {expectedDetected: false, minConfidence: 0.0, boundary: false}

- id: network.timeout.default
  name: 超时断连
  category: NETWORK
  sampleType: TIMEOUT_DISCONNECT
  target: network-stack
  source: 内置异常样本
