      params: {timeoutTick: 20, reason: read_timeout}
      expected: {expectedDetected: false, minConfidence: 0.0, boundary: false}
    - tier: MAX
      params: {timeoutTick: 10, reason: read_timeout}
      expected: {expectedDetected: false, minConfidence: 0.0, boundary: false}
    - tier: HIDDEN
      params: {timeoutTick: 25, reason: keepalive_timeout}
      expected: {expectedDetected: false, minConfidence: 0.0, boundary: false}

