# 通用异常样本（4.2）：无效输入、越界参数、并发竞争、资源引用缺失、故障注入。
# 这些样本只验证被测目标的功能鲁棒性，expectedDetected 恒为 false，
# 不计入检出率；未注入的档位会进入报告的「未覆盖项清单」。

# ---------- CONTENT ----------
- id: content.duplicate-registry.default
  name: 注册表重复条目
  category: CONTENT
  sampleType: DUPLICATE_REGISTRY_ENTRY
  target: server-runtime
  source: 内置异常样本
  injector: content
  baseline: baseline:walk
  notes: 同一 tick 重复注册同一注册表条目，探测注册表是否去重或拒绝二次写入
  tiers:
    - tier: MIN
      params: {duplicateCount: 1, registry: minecraft:item, entry: minecraft:stone}
      expected: {expectedDetected: false, minConfidence: 0.0, boundary: true, note: 单次重复注册，边界输入}
    - tier: DEFAULT
      params: {duplicateCount: 2, registry: minecraft:item, entry: minecraft:stone}
      expected: {expectedDetected: false, minConfidence: 0.0, boundary: false}
    - tier: MAX
      params: {duplicateCount: 4, registry: minecraft:item, entry: minecraft:stone}
      expected: {expectedDetected: false, minConfidence: 0.0, boundary: false}
    - tier: HIDDEN
      params: {duplicateCount: 2, registry: minecraft:block, entry: minecraft:stone}
      expected: {expectedDetected: false, minConfidence: 0.0, boundary: false}

