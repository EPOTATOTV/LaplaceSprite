# ---------- NETWORK ----------
- id: network.packet-loss.default
  name: 丢包突发
  category: NETWORK
  sampleType: PACKET_LOSS_BURST
  target: network-stack
  source: 内置异常样本
  injector: network
  baseline: baseline:walk
  notes: 在突发窗口内按固定间隔丢包，探测重传与状态同步是否会把丢包放大成断线
  tiers:
    - tier: MIN
      params: {dropEvery: 8, startTick: 0, burstTicks: 40}
      expected: {expectedDetected: false, minConfidence: 0.0, boundary: true, note: 每 8 包丢 1 包，边界输入}
    - tier: DEFAULT
      params: {dropEvery: 4, startTick: 0, burstTicks: 40}
      expected: {expectedDetected: false, minConfidence: 0.0, boundary: false}
    - tier: MAX
      params: {dropEvery: 2, startTick: 0, burstTicks: 40}
      expected: {expectedDetected: false, minConfidence: 0.0, boundary: false}
    - tier: HIDDEN
      params: {dropEvery: 6, startTick: 10, burstTicks: 20}
      expected: {expectedDetected: false, minConfidence: 0.0, boundary: false}

- id: network.reorder.default
  name: 乱序重排
  category: NETWORK
