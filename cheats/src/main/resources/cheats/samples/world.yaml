- id: xray.meteor.default
  name: Meteor XRay 默认档
  category: CHEAT
  type: XRAY
  target: detection-engine
  source: Meteor
  injector: xray
  baseline: baseline:mine
  notes: 注入幅度 = 阈值锚点 6.0 × 档位系数（MIN 1.1 / DEFAULT 1.5 / MAX 2.0 / HIDDEN 1.2）；Meteor 仅为出处标签
  tiers:
    - tier: MIN
      params: {ore: diamond_ore, oresPerTick: 1, range: 6.6}
      expected: {expectedDetected: true, minConfidence: 0.5, boundary: true, note: 阈值边界样本}
    - tier: DEFAULT
      params: {ore: diamond_ore, oresPerTick: 2, range: 9.0}
      expected: {expectedDetected: true, minConfidence: 0.9, boundary: false}
    - tier: MAX
      params: {ore: ancient_debris, oresPerTick: 4, range: 12.0}
      expected: {expectedDetected: true, minConfidence: 0.97, boundary: false}
    - tier: HIDDEN
      params: {ore: emerald_ore, oresPerTick: 1, range: 7.2, spoofBrand: true, brand: vanilla, modId: meteor}
      expected: {expectedDetected: true, minConfidence: 0.7, boundary: false}

