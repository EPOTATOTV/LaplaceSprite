- id: scaffold.liquidbounce.default
  name: LiquidBounce Scaffold 默认档
  category: CHEAT
  type: SCAFFOLD
  target: detection-engine
  source: LiquidBounce
  injector: scaffold
  baseline: baseline:bridge-sprint
  notes: 注入幅度 = 阈值锚点 0.8 × 档位系数（MIN 1.25 / DEFAULT 2.5 / MAX 3.75 / HIDDEN 1.25）；LiquidBounce 仅为出处标签
  tiers:
    - tier: MIN
      params: {block: dirt, blocksPerTick: 1.0}
      expected: {expectedDetected: true, minConfidence: 0.5, boundary: true, note: 阈值边界样本}
    - tier: DEFAULT
      params: {block: netherrack, blocksPerTick: 2.0}
      expected: {expectedDetected: true, minConfidence: 0.9, boundary: false}
    - tier: MAX
      params: {block: end_stone, blocksPerTick: 3.0}
      expected: {expectedDetected: true, minConfidence: 0.97, boundary: false}
    - tier: HIDDEN
      params: {block: obsidian, blocksPerTick: 1.0, spoofBrand: true, brand: forge, modId: liquidbounce}
      expected: {expectedDetected: true, minConfidence: 0.7, boundary: false}

