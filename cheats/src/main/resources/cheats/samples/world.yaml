- id: fasteat.wurst.default
  name: Wurst FastEat 默认档
  category: CHEAT
  type: FAST_EAT
  target: detection-engine
  source: Wurst
  injector: fasteat
  baseline: baseline:walk
  notes: 注入幅度 = 阈值锚点 16 × 档位系数（MIN 0.875 / DEFAULT 0.25 / MAX 0.125 / HIDDEN 0.75）；Wurst 仅为出处标签
  tiers:
    - tier: MIN
      params: {consumeTicks: 14.0, item: golden_apple}
      expected: {expectedDetected: true, minConfidence: 0.5, boundary: true, note: 阈值边界样本}
    - tier: DEFAULT
      params: {consumeTicks: 4.0, item: golden_apple}
      expected: {expectedDetected: true, minConfidence: 0.9, boundary: false}
    - tier: MAX
      params: {consumeTicks: 2.0, item: enchanted_golden_apple}
      expected: {expectedDetected: true, minConfidence: 0.97, boundary: false}
    - tier: HIDDEN
      params: {consumeTicks: 12.0, item: golden_apple, spoofBrand: true, brand: fabric, modId: wurst}
      expected: {expectedDetected: true, minConfidence: 0.7, boundary: false}

