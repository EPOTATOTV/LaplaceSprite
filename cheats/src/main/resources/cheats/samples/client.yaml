- id: speed.lambda.hidden
  name: Lambda Speed 隐蔽档
  type: SPEED
  target: detection-engine
  source: Lambda
  injector: speed
  baseline: baseline:sprint
  notes: 注入幅度 = 阈值锚点 0.30 × 档位系数（MIN 3.7 / DEFAULT 4.5 / MAX 6.3 / HIDDEN 4.0）；Lambda 仅为出处标签
  tiers:
    - tier: MIN
      params: {speed: 1.11, sprint: true}
      expected: {expectedDetected: true, minConfidence: 0.5, boundary: true, note: 阈值边界样本}
    - tier: DEFAULT
      params: {speed: 1.35, sprint: true}
      expected: {expectedDetected: true, minConfidence: 0.9, boundary: false}
    - tier: MAX
      params: {speed: 1.89, sprint: true}
      expected: {expectedDetected: true, minConfidence: 0.97, boundary: false}
    - tier: HIDDEN
      params: {speed: 1.2, sprint: true, spoofBrand: true, brand: vanilla, modId: lambda}
      expected: {expectedDetected: true, minConfidence: 0.7, boundary: false}

