- id: xray.bleachhack.default
  name: BleachHack XRay 默认档
  type: XRAY
  target: detection-engine
  source: BleachHack
  injector: xray
  baseline: baseline:mine
  notes: 注入幅度 = 阈值锚点 6.0 × 档位系数（MIN 1.1 / DEFAULT 1.5 / MAX 2.0 / HIDDEN 1.2）；BleachHack 仅为出处标签
  tiers:
    - tier: MIN
      params: {ore: diamond_ore, oresPerTick: 1, range: 6.6}
      expected: {expectedDetected: true, minConfidence: 0.5, boundary: true, note: 阈值边界样本}
