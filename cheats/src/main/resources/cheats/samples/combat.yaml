- id: reach.meteor.default
  name: Meteor Reach 默认档
  category: CHEAT
  type: REACH
  target: detection-engine
  source: Meteor
  injector: reach
  baseline: baseline:pvp
  notes: 注入幅度 = 阈值锚点 3.0 × 档位系数（MIN 1.1 / DEFAULT 1.5 / MAX 2.0 / HIDDEN 1.2）；Meteor 仅为出处标签
  tiers:
    - tier: MIN
      params: {reach: 3.3, clicksPerSecond: 10}
      expected: {expectedDetected: true, minConfidence: 0.5, boundary: true, note: 阈值边界样本}
    - tier: DEFAULT
      params: {reach: 4.5, clicksPerSecond: 12}
      expected: {expectedDetected: true, minConfidence: 0.9, boundary: false}
    - tier: MAX
      params: {reach: 6.0, clicksPerSecond: 14}
      expected: {expectedDetected: true, minConfidence: 0.97, boundary: false}
    - tier: HIDDEN
      params: {reach: 3.6, clicksPerSecond: 10, spoofBrand: true, brand: vanilla, modId: meteor}
      expected: {expectedDetected: true, minConfidence: 0.7, boundary: false}

